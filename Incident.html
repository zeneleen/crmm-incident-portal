<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Incident Status | CRMM Portal</title>
  <link rel="stylesheet" href="incidentStyle.css">
  <style>
    #incidentTable {
      table-layout: auto;
      width: 100%;
    }
    td:nth-child(1),
    th:nth-child(1),
    td:nth-child(2),
    th:nth-child(2) {
      min-width: 180px !important;
      white-space: nowrap;
      overflow: visible;
    }
    td:nth-child(1) input,
    td:nth-child(2) select {
      font-family: monospace;
      font-size: 14px;
      width: 100%;
      overflow-wrap: anywhere;
    }

    /* 🔹 Filters layout */
    .filter-container {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 20px;
    }
    .filter-container label {
      font-weight: 600;
      color: #2b3a67;
    }
    .filter-container select {
      min-width: 180px;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="user-info">
      <span id="userInfo"></span>
    </div>
    <button id="logoutBtn" type="button">Logout</button>
  </header>

  <main>
    <h2>Incident Status</h2>

    <!-- 🔹 Filter section (visible based on user role) -->
    <div class="filter-container" id="filterContainer" style="display: none;">
      <div id="orgFilterGroup" style="display: none;">
        <label for="organisationFilter">Organisation:</label>
        <select id="organisationFilter">
          <option value="">All</option>
        </select>
      </div>

      <div id="userFilterGroup" style="display: none;">
        <label for="userFilter">User:</label>
        <select id="userFilter">
          <option value="">All</option>
        </select>
      </div>

      <button id="applyFilterBtn" type="button">Apply Filter</button>
    </div>

    <form id="incidentForm">
      <table id="incidentTable">
        <thead>
          <tr>
            <th>case_id</th>
            <th>user_id</th>
            <th>organisation</th>
            <th>Survivor(s) under 18?</th>
            <th>At least one of the eight serious child rights violations?</th>
            <th>Armed group involved?</th>
            <th>Incident remarks</th>
            <th>Verification status</th>
            <th>Verification remarks</th>
          </tr>
        </thead>
        <tbody id="incidentBody"></tbody>
      </table>

      <div class="table-actions">
        <button type="button" id="addRowBtn" title="Add Row">＋</button>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
      <p id="message"></p>
    </form>
  </main>

  <script type="module" src="incident.js"></script>
</body>
</html>
