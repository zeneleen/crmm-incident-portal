<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Incident Status | CRMM Portal</title>
  <link rel="stylesheet" href="incidentStyle.css">
  <style>
    /* 👇 Fix for case_id and user_id visibility */
    #incidentTable {
      table-layout: auto;
      width: 100%;
    }
    td:nth-child(1),
    th:nth-child(1),
    td:nth-child(2),
    th:nth-child(2) {
      min-width: 180px !important;
      white-space: nowrap;
      overflow: visible;
    }
    td:nth-child(1) input,
    td:nth-child(2) select {
      font-family: monospace;
      font-size: 14px;
      width: 100%;
      overflow-wrap: anywhere;
    }

    /* 🔍 Filters layout */
    .filters {
      margin: 15px 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }
    .filters label {
      font-weight: 500;
      color: #2b3a67;
    }
    .filters select {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #cbd3da;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="user-info">
      <span id="userInfo"></span>
    </div>
    <button id="logoutBtn" type="button">Logout</button>
  </header>

  <main>
    <h2>Incident Status</h2>

    <!-- 🔍 Filter Section -->
    <div class="filters" id="filtersContainer">
      <label for="filterUser" id="userFilterLabel">Filter by User:</label>
      <select id="filterUser">
        <option value="">All Users</option>
      </select>

      <label for="filterOrg" id="orgFilterLabel">Filter by Organisation:</label>
      <select id="filterOrg">
        <option value="">All Organisations</option>
      </select>
    </div>

    <form id="incidentForm">
      <table id="incidentTable">
        <thead>
          <tr>
            <th>case_id</th>
            <th>user_id</th>
            <th>organisation</th>
            <th>Survivor(s) under 18?</th>
            <th>At least one of the eight serious child rights violations?</th>
            <th>Armed group involved?</th>
            <th>Incident remarks</th>
            <th>Verification status</th>
            <th>Verification remarks</th>
          </tr>
        </thead>
        <tbody id="incidentBody"></tbody>
      </table>

      <div class="table-actions">
        <button type="button" id="addRowBtn" title="Add Row">＋</button>
      </div>

      <button type="submit" id="submitBtn">Submit</button>
      <p id="message"></p>
    </form>
  </main>

  <!-- ==========================================
       JS: Dynamically hide filters by role
       ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore, collection, getDocs, query, where, setDoc, doc
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDP1uofFj_RHYZWLprN4P613UyXgi1suM30",
      authDomain: "crmm-cxb.firebaseapp.com",
      projectId: "crmm-cxb",
      storageBucket: "crmm-cxb.appspot.com",
      messagingSenderId: "920459967885",
      appId: "1:920459967885:web:402c2800ebe786ee5391c4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", async () => {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (!user) {
        alert("Please login first.");
        window.location.href = "index.html";
        return;
      }

      // Display logged user
      document.getElementById("userInfo").textContent =
        `Logged in as: ${user.id} (${user.organisation} | ${user.type})`;

      // === Hide/Show filters based on role ===
      const filterUser = document.getElementById("filterUser");
      const filterOrg = document.getElementById("filterOrg");
      const userFilterLabel = document.getElementById("userFilterLabel");
      const orgFilterLabel = document.getElementById("orgFilterLabel");

      if (user.type === "monitor") {
        // Monitors see no filters
        document.getElementById("filtersContainer").style.display = "none";
      } else if (user.type === "supervisor") {
        // Supervisors see only User filter (for their org)
        filterOrg.style.display = "none";
        orgFilterLabel.style.display = "none";
      } 
      // Admins see both filters (default)

      // Load external JS logic after access setup
      const script = document.createElement("script");
      script.type = "module";
      script.src = "incident.js";
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
